<script>
(() => {
'use strict';

/* ================= config ================= */
const config = {
  H: 360, minW: 480, GY: 250,
  vmax: 170, accel: 300, brake: 700, crossV: 85,
  gapPattern: [0.26, 0.44, 0.32, 0.5, 0.23, 0.38], riverDist: 900, stopGap: 70, finishOver: 26,
  sceneOrder: ['river', 'river', 'crossing', 'river', 'station'],
  maxArch: 80, archA: 26, shapeBlend: 0.45, maxSlope: 0.55,
  sampleStep: 8, plankEvery: 2,
  guideEmphAt: 6, autoAt: 14, drawStallAt: 5,
  palmSize: 120, menuHoldMs: 1800, menuZone: 96,
  buildTime: 2.2, rewardTime: 3.6, departTime: 3.4, maxParticles: 350
};
const GY = config.GY;
const OUTLINE = '#5b3d2b';

/* ================= utils ================= */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const easeOutBack = k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); };

/* ================= state ================= */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const S = {
  W: 640, s: 1, oy: 0, dpr: 1, cw: 640, ch: 360, portrait: false, menuOpen: false,
  camX: 0, trainX: 120, vel: 0, time: 0, state: 'READY', stateT: 0, callT: 0, ftAvg: 0.016, lowFx: false,
  rivers: [], crossings: [], stations: [], upcoming: null, riders: [], tapQueue: 0, cur: null, bellT: 0, riverCount: 0,
  stroke: [], primary: null, active: new Map(), idle: 0, lastMove: 0, strokeDone: false,
  sceneNo: 0, fishT: 3, shake: 0, heartT: 0, drawDist: 0, jiggle: 0, sunSpin: 0, lastToot: -9, particles: [], animals: [], hopY: 0, wave: false, rw: {}, smokeT: 0, tickX: 0, geom: [], lastPon: 0,
  peeks: new Map(), peekN: 0, birds: [], puffs: new Map()
};

/* ================= defs (拡張点) ================= */
const defs = {
  vehicles: {
    train: {
      gap: 4,
      cars: [
        { engine: true, len: 60, hb: 20, color: '#ef5b5b' },
        { len: 46, hb: 12, color: '#4aa3df', spr: 'carBlue' },
        { len: 46, hb: 12, color: '#f4c542', spr: 'carYellow' }
      ]
    }
  },
  scenes: { river: { waterTop: GY + 30, dirt: '#a2723f', shade: '#7d5329', water: '#4aa8e8', ripple: '#9bd6f7' } },
  // 橋の種類。川ごとに order の順でかわる。sag=渡るときのたわみの大きさ
  bridges: {
    order: ['wood', 'iron', 'rope'],
    wood: { colors: ['#b8803f', '#a8712f'], rail: '#d9a05b', beam: '#8a5a2b', sag: 1 },
    iron: { deck: '#6f7f99', truss: '#de5a50', trussDark: '#8f2f2a', sag: 0.35 },
    rope: { colors: ['#d8a76a', '#c99558'], cable: '#8a6a4a', tower: '#a8743f', sag: 2.4 }
  },
  rewards: {
    hop:      s => { s.rw.hop = true; },
    animals:  s => { spawnAnimals(); },
    confetti: s => { s.rw.confetti = true; }
  }
};
const VEH = defs.vehicles.train;
const TRAIN_LEN = VEH.cars.reduce((a, c) => a + c.len, 0) + VEH.gap * (VEH.cars.length - 1);

/* ================= theme (場面ごとの空の色。川1種類のまま雰囲気だけ変える) ================= */
const THEMES = [
  { top: [159, 216, 255], bot: [234, 248, 255], h1: [182, 227, 166], h2: [154, 216, 139], sun: [255, 236, 150] },
  { top: [255, 176, 150], bot: [255, 234, 196], h1: [208, 208, 150], h2: [176, 196, 120], sun: [255, 196, 120] },
  { top: [140, 190, 255], bot: [252, 238, 255], h1: [170, 222, 196], h2: [130, 206, 164], sun: [255, 250, 205] }
];
const rgb = a => 'rgb(' + (a[0] | 0) + ',' + (a[1] | 0) + ',' + (a[2] | 0) + ')';
const th = JSON.parse(JSON.stringify(THEMES[0]));
function lerpTheme(dt) {
  const tgt = THEMES[Math.floor(S.sceneNo / config.sceneOrder.length) % THEMES.length], k = 1 - Math.exp(-dt * 0.35);
  for (const key in th) for (let i = 0; i < 3; i++) th[key][i] += (tgt[key][i] - th[key][i]) * k;
}

/* ================= audio ================= */
const audio = {
  ctx: null, master: null, muted: false, vol: 0.6, noiseBuf: null,
  init() {
    try {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : this.vol;
      this.master.connect(this.ctx.destination);
    } catch (e) { this.ctx = null; }
  },
  setMuted(m) {
    this.muted = m;
    if (this.master) this.master.gain.value = m ? 0 : this.vol;
    try { localStorage.setItem('nazotte.muted', m ? '1' : '0'); } catch (e) {}
  },
  tone(freq, o) {
    const c = this.ctx; if (!c || this.muted) return;
    o = o || {};
    const dur = o.dur || 0.2, gain = o.gain || 0.3, t = c.currentTime + (o.delay || 0);
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq * o.slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(gain, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + dur + 0.03);
  },
  noise(dur, gain, freq) {
    const c = this.ctx; if (!c || this.muted) return;
    if (!this.noiseBuf) {
      this.noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
      const d = this.noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = c.createBufferSource(); src.buffer = this.noiseBuf; src.loop = true;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 1500;
    const g = c.createGain(); const t = c.currentTime;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t); src.stop(t + dur + 0.03);
  },
  blast(delay, dur) {
    const c = this.ctx; if (!c || this.muted) return;
    const t = c.currentTime + delay;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.22, t + 0.05);
    g.gain.setValueAtTime(0.22, t + dur - 0.1);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    g.connect(this.master);
    const lfo = c.createOscillator(), lg = c.createGain();
    lfo.frequency.value = 6; lg.gain.value = 9; lfo.connect(lg);
    [600, 760, 900].forEach(f => {
      const o = c.createOscillator(); o.type = 'triangle';
      o.frequency.setValueAtTime(f * 0.93, t); o.frequency.linearRampToValueAtTime(f, t + 0.08);
      lg.connect(o.frequency); o.connect(g); o.start(t); o.stop(t + dur + 0.05);
    });
    lfo.start(t); lfo.stop(t + dur + 0.05);
  },
  whistle() { this.blast(0, 0.28); this.blast(0.35, 0.8); },
  plank(i, type) { const n = [523.25, 587.33, 659.25, 784, 880, 1046.5, 1174.7, 1318.5, 1568][Math.min(i, 8)];
    if (type === 'iron') { this.tone(n * 2, { dur: 0.09, type: 'square', gain: 0.06 }); this.tone(n * 3.01, { dur: 0.35, gain: 0.09 }); this.tone(n * 4.2, { dur: 0.2, gain: 0.04 }); return; }
    if (type === 'rope') { this.tone(n / 2, { dur: 0.42, type: 'triangle', gain: 0.3 }); this.tone(n, { dur: 0.2, gain: 0.08 }); return; }
    this.tone(n, { dur: 0.3, type: 'triangle', gain: 0.32 }); this.tone(n * 2, { dur: 0.12, gain: 0.1 }); },
  chime() { [523.25, 659.25, 784, 1046.5].forEach((f, i) => this.tone(f, { dur: 0.35, type: 'triangle', gain: 0.25, delay: i * 0.09 })); },
  hop() { this.tone(320, { dur: 0.18, type: 'square', gain: 0.1, slide: 2 }); },
  pon() { this.tone(700, { dur: 0.1, gain: 0.2, slide: 1.3 }); },
  pop() { this.tone(500, { dur: 0.12, gain: 0.22, slide: 1.8 }); },
  brake() { this.noise(0.5, 0.12, 2500); },
  // ガタン・ゴトン(橋の上は木のコトコト)
  gatan(onBridge) {
    if (onBridge) { this.tone(330, { dur: 0.06, type: 'triangle', gain: 0.16 }); this.tone(280, { dur: 0.06, type: 'triangle', gain: 0.13, delay: 0.1 }); }
    else { this.tone(110, { dur: 0.08, gain: 0.18 }); this.tone(92, { dur: 0.08, gain: 0.15, delay: 0.1 }); }
  },
  // なぞっている間、右へ進むほど音が上がる
  drawNote(p) { this.tone(392 * Math.pow(2, p * 1.2), { dur: 0.09, type: 'sine', gain: 0.12 }); },
  toot() { this.blast(0, 0.22); },
  doorChime() { this.tone(880, { dur: 0.45, gain: 0.18 }); this.tone(698.5, { dur: 0.7, gain: 0.18, delay: 0.32 }); },
  bell() { this.tone(880, { dur: 0.16, type: 'triangle', gain: 0.2 }); this.tone(1320, { dur: 0.08, gain: 0.06 }); },
  honk() { this.tone(440, { dur: 0.12, type: 'square', gain: 0.09 }); this.tone(554, { dur: 0.12, type: 'square', gain: 0.06 });
    this.tone(440, { dur: 0.16, type: 'square', gain: 0.09, delay: 0.18 }); this.tone(554, { dur: 0.16, type: 'square', gain: 0.06, delay: 0.18 }); },
  // ぽわっ(雲)
  puff() { this.tone(260, { dur: 0.25, type: 'sine', gain: 0.16, slide: 1.6 }); this.noise(0.25, 0.05, 900); },
  cry(kind) { this.pop(); },
  twinkle() { [1568, 2093, 2637].forEach((f, i) => this.tone(f, { dur: 0.18, gain: 0.1, delay: i * 0.06 })); }
};
try { audio.muted = localStorage.getItem('nazotte.muted') === '1'; } catch (e) {}
// 振動(対応端末のみ。消音中は振動もしない)
function buzz(ms) { try { if (!audio.muted && navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ================= bridge (軌跡→橋) ================= */
function makeBridge(L, R, pts) {
  pts = pts.slice();
  if (pts.length > 1 && pts[0].x > pts[pts.length - 1].x) pts.reverse();
  const k = [{ x: L, d: 0 }];
  let mx = L;
  for (const p of pts) {
    const x = clamp(p.x, L, R);
    if (x > mx + 3 && x < R - 3) { k.push({ x, d: clamp(GY - p.y, -12, config.maxArch) }); mx = x; }
  }
  k.push({ x: R, d: 0 });
  const n = Math.max(8, Math.round((R - L) / config.sampleStep));
  const dx = (R - L) / n;
  let d = new Array(n + 1);
  let j = 0;
  for (let i = 0; i <= n; i++) {
    const x = L + i * dx;
    while (j < k.length - 2 && x > k[j + 1].x) j++;
    const a = k[j], b = k[j + 1], u = clamp((x - a.x) / Math.max(1, b.x - a.x), 0, 1);
    d[i] = a.d + (b.d - a.d) * u;
  }
  for (let pass = 0; pass < 4; pass++) {
    const e = d.slice();
    for (let i = 0; i <= n; i++) {
      let sum = 0;
      for (let q = -2; q <= 2; q++) sum += e[clamp(i + q, 0, n)];
      d[i] = sum / 5;
    }
  }
  for (let i = 0; i <= n; i++) {
    const t = i / n, arch = config.archA * 4 * t * (1 - t);
    d[i] = config.shapeBlend * arch + (1 - config.shapeBlend) * d[i];
  }
  d[0] = 0; d[n] = 0;
  const ms = config.maxSlope * dx;
  for (let i = 1; i <= n; i++) d[i] = clamp(d[i], d[i - 1] - ms, d[i - 1] + ms);
  d[n] = 0;
  for (let i = n - 1; i >= 0; i--) d[i] = clamp(d[i], d[i + 1] - ms, d[i + 1] + ms);
  d[0] = 0;
  const ys = d.map(v => GY - v);
  const pe = config.plankEvery;
  return { L, R, n, dx, ys, pe, N: Math.ceil(n / pe) };
}
function bridgeY(b, x) {
  const t = clamp((x - b.L) / b.dx, 0, b.n), i = Math.min(b.n - 1, Math.floor(t)), f = t - i;
  return b.ys[i] * (1 - f) + b.ys[i + 1] * f;
}
function trackY(x) {
  for (const r of S.rivers) if (r.bridge && x > r.L && x < r.R) return bridgeY(r.bridge, x) + sag(r, x);
  return GY;
}
// 電車が乗っている所だけ、橋が少したわむ(前フレームの車両位置を使う)
function sag(r, x) {
  if (r !== S.cur || (S.state !== 'CROSS' && S.state !== 'REWARD')) return 0;
  let s = 0;
  for (const g of S.geom) s += Math.exp(-Math.pow(x - g.cx, 2) / 900);
  const k = (defs.bridges[r.type] || defs.bridges.wood).sag;
  // つり橋は、乗っている間ゆったりと上下にゆれる(細かくは震えない)
  const sway = r.type === 'rope' ? 1 + 0.25 * Math.sin(S.time * 2.2) : 1;
  return Math.min(1, s) * 4 * k * sway * Math.sin(Math.PI * clamp((x - r.L) / (r.R - r.L), 0, 1));
}

/* ================= world ================= */
function makeRiver(afterX, dist) {
  const L = afterX + (dist || config.riverDist + rand(0, 160));
  const gap = S.W * clamp(config.gapPattern[S.riverCount % config.gapPattern.length] + rand(-0.025, 0.025), 0.2, 0.52);
  // 小さい画面では、汽車を画面に入れたまま向こう岸の先まで指が届くよう、いちばん広い川を少しせまく
  const gapFit = Math.min(gap, S.W - 350);
  const type = defs.bridges.order[(S.riverCount++) % defs.bridges.order.length];
  return { kind: 'river', type, L, R: L + gapFit, bridge: null, bt: 0, plankN: 0, burst: false };
}
// 踏切: L〜R が道路の幅。gate は遮断機の下がり具合(0=上がっている,1=下りている)、carT は車の進み具合
function makeCrossing(afterX) {
  const x = afterX + config.riverDist + rand(0, 160);
  return { kind: 'crossing', L: x - 34, R: x + 34, x, gate: 0, carT: 0, honked: false };
}
// 駅: stopX に電車の先頭が止まる。pL〜pR がホーム。waiting=待っている動物、alighter=降りてくる動物
function makeStation(afterX) {
  const stopX = afterX + config.riverDist + rand(0, 160) + 120;
  const kinds = ANIMALS.slice().sort(() => Math.random() - 0.5);
  return {
    kind: 'station', stopX, L: stopX + config.stopGap, R: stopX + config.stopGap + 10,
    pL: stopX - TRAIN_LEN - 60, pR: stopX + 60,
    waiting: [0, 1, 2].map(i => ({ kind: kinds[i], x: stopX - 112 + i * 38, y: GY + 8, state: 'wait', t: 0, car: i % 2 ? 2 : 1 })),
    alighter: { kind: ANIMALS[(Math.random() * ANIMALS.length) | 0], x: 0, y: 0, t: -1 }, nextT: 0
  };
}
// 場面を1つ作って、描画用のリストに入れる
function makeScene(no, afterX) {
  const kind = config.sceneOrder[no % config.sceneOrder.length];
  const s = kind === 'crossing' ? makeCrossing(afterX) : kind === 'station' ? makeStation(afterX) : makeRiver(afterX);
  (kind === 'crossing' ? S.crossings : kind === 'station' ? S.stations : S.rivers).push(s);
  return s;
}
// 次の場面は1つ先まで前もって置いておく(画面に入ってから突然あらわれないように)。
// 通りすぎて画面の外へ出たものだけ片づける
function nextScene() {
  S.sceneNo++;
  S.cur = S.upcoming;
  S.upcoming = makeScene(S.sceneNo + 1, S.cur.R);
  const gone = s => s !== S.cur && s !== S.upcoming && Math.max(s.R, s.pR || 0) < S.camX - 300;
  S.rivers = S.rivers.filter(s => !gone(s));
  S.crossings = S.crossings.filter(s => !gone(s));
  S.stations = S.stations.filter(s => !gone(s));
  S.animals = S.animals.filter(a => a.x > S.camX - 200);
  go('RUN');
}

function weatherNow() { return 'sun'; }

/* ================= particles ================= */
function addP(p) { if (S.particles.length > (S.lowFx ? 140 : config.maxParticles)) S.particles.shift(); S.particles.push(p); }
function sparks(x, y, n, colors) {
  colors = colors || ['#fff6a8', '#ffd24a', '#ffffff'];
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), v = rand(30, 110);
    addP({ type: 'spark', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, g: 160, life: rand(0.4, 0.8), max: 0.8, size: rand(2, 4), color: colors[(Math.random() * colors.length) | 0] });
  }
}
function stars(x, y, n) {
  const cols = ['#ffd24a', '#ff8fb1', '#7fd6ff', '#9be37a', '#ffffff'];
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), v = rand(40, 140);
    addP({ type: 'star', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, g: 120, life: rand(0.8, 1.4), max: 1.4, size: rand(5, 10), color: cols[(Math.random() * cols.length) | 0], rot: rand(0, 6), vr: rand(-4, 4) });
  }
}
function smoke(x, y, big) {
  addP({ type: 'smoke', x, y, vx: rand(-8, 8) - S.vel * 0.15, vy: rand(-34, -22), g: -4, life: rand(0.9, 1.4), max: 1.4, size: big ? rand(7, 11) : rand(4, 6), color: '#ffffff' });
}
function confetti() {
  const cols = ['#ff6b6b', '#ffd24a', '#6bd36b', '#5fb7ff', '#ff8fd6'];
  addP({ type: 'conf', x: S.camX + rand(0, S.W), y: -10, vx: rand(-20, 20), vy: rand(40, 90), g: 10, life: rand(2.5, 3.5), max: 3.5, size: rand(4, 7), color: cols[(Math.random() * cols.length) | 0], rot: rand(0, 6), vr: rand(-6, 6) });
}
function fish(x) {
  const top = defs.scenes.river.waterTop;
  sparks(x, top, 6, ['#ffffff', '#bfe9ff']);
  addP({ type: 'fish', x, y: top, wy: top + 1, vx: rand(-40, 40), vy: -rand(190, 250), g: 520, life: 2, max: 2, size: 1, color: ['#ff9f43', '#ff6b81', '#ffd24a'][(Math.random() * 3) | 0] });
}
function spawnAnimals() {
  const kinds = ANIMALS.slice().sort(() => Math.random() - 0.5).slice(0, 3);
  const xs = [S.cur.R + 70, S.cur.R + 135, S.cur.R + 200];
  kinds.forEach((k, i) => S.animals.push({ kind: k, x: xs[i], y: GY + 78 + (i % 2) * 8, t0: S.time + 0.2 + i * 0.35, popped: false }));
}

/* ================= いないいないばあ(茂み・木・雲) ================= */
const PEEK_UP = 0.3, PEEK_STAY = 2.4;
// なぞる川の近くでは、なぞりを優先する(風景のタッチにしない)
function nearDrawZone(x) {
  const c = S.cur;
  return c && c.kind === 'river' && !c.bridge && x > c.L - 60 && x < c.R + config.finishOver + 60;
}
// 触れた所に茂み・木・雲があれば、動物・小鳥・雨を出して true
function pokeScenery(w, lx, ly) {
  const i0 = Math.floor(w.x / 130);
  // 雲は空の上の方なので、なぞる場所とは重ならない
  for (let i = i0 - 1; i <= i0 + 1 && !nearDrawZone(w.x); i++) {
    const { bush, tree } = scenery(i);
    if (bush && Math.abs(w.x - bush.x) < 34 * bush.sc + 12 && w.y > GY - 30 * bush.sc - 40 && w.y < GY + 18) {
      const pk = S.peeks.get(i);
      // 出ている動物をもう一度触ると、ぴょんと跳ねてもう一度鳴く
      if (pk && S.time - pk.t0 < PEEK_UP + PEEK_STAY) { pk.t0 = Math.min(pk.t0, S.time - PEEK_UP); pk.hop = S.time; audio.cry(pk.kind); return true; }
      const kind = ANIMALS[S.peekN++ % ANIMALS.length];
      S.peeks.set(i, { kind, t0: S.time, hop: -9 });
      audio.pop(); setTimeout(() => audio.cry(kind), 220);
      sparks(bush.x, GY - 30, 8);
      return true;
    }
    if (tree && Math.abs(w.x - tree.x) < 36 * tree.sc + 8 && w.y > GY + 6 - 100 * tree.sc && w.y < GY + 6 - 26 * tree.sc) {
      if (S.birds.length < 8) {
        const col = ['#ffd24a', '#7fd6ff', '#ff8fb1'][(S.peekN++) % 3];
        S.birds.push({ x: tree.x + rand(-10, 10), y: GY + 6 - 62 * tree.sc, vx: rand(50, 80) * (Math.random() < 0.5 ? -1 : 1), vy: -rand(70, 95), t: 0, col });
        audio.cry('bird');
      }
      sparks(w.x, w.y, 6, ['#b8f08a', '#ffffff', '#7fd36b']);
      return true;
    }
  }
  const cl = cloudAt(lx, ly);
  if (cl) {
    S.puffs.set(cl.i, S.time);
    const snow = weatherNow() === 'snow';
    for (let k = 0; k < (snow ? 14 : 18); k++) addP(snow
      ? { type: 'flake', x: cl.x + S.camX + rand(-40, 40) * cl.sc, y: cl.y + 8, vx: rand(-10, 10), vy: rand(20, 40), g: 0, life: 3.2, max: 3.2, size: rand(2.4, 4), color: '#fff', ph: rand(0, 6) }
      : { type: 'drop', x: cl.x + S.camX + rand(-40, 40) * cl.sc, y: cl.y + 8 + rand(0, 20), vx: 0, vy: rand(180, 240), g: 300, life: 0.9, max: 0.9, size: 1, color: '#7cc3f5' });
    audio.puff();
    return true;
  }
  return false;
}
function updateScenery(dt) {
  for (const [i, pk] of S.peeks) if (S.time - pk.t0 > PEEK_UP * 2 + PEEK_STAY) S.peeks.delete(i);
  for (const [i, t] of S.puffs) if (S.time - t > 0.6) S.puffs.delete(i);
  for (const b of S.birds) { b.t += dt; b.x += b.vx * dt; b.y += b.vy * dt; b.vy += (b.t < 0.4 ? 40 : -10) * dt; }
  S.birds = S.birds.filter(b => b.t < 5);
}
// 茂みの後ろから、動物がぴょこっと顔を出す(下は地面に隠れる)
function drawPeek(pk, x, sc) {
  const age = S.time - pk.t0;
  const up = pk.tease ? 0.7 * pk.tease : age < PEEK_UP ? easeOutBack(age / PEEK_UP) : age < PEEK_UP + PEEK_STAY ? 1 : 1 - clamp((age - PEEK_UP - PEEK_STAY) / PEEK_UP, 0, 1);
  const hop = Math.max(0, Math.sin(clamp((S.time - pk.hop) / 0.35, 0, 1) * Math.PI)) * 10;
  const y = GY + 8 + (1 - up) * 80 - 6 * sc - hop;
  ctx.save(); ctx.translate(x + 4, y); ctx.scale(0.72, 0.72);
  drawAnimalArm(ANIMAL_COL[pk.kind], age, up > 0.9);
  spr(pk.kind, 0, 0);
  ctx.restore();
}
function drawBirdsFlying() {
  for (const b of S.birds) {
    const f = Math.sin(b.t * 22) * 5, d = b.vx < 0 ? -1 : 1;
    ctx.save(); ctx.translate(b.x, b.y); ctx.scale(d, 1);
    ell(0, 0, 8, 6.5, b.col, 'rgba(80,60,40,.6)');
    ctx.beginPath(); ctx.moveTo(-2, -1); ctx.quadraticCurveTo(-6, -8 - f, -12, -6 - f); ctx.quadraticCurveTo(-7, 1, -2, 2); fs('#ffffff', 'rgba(80,60,40,.6)', 1.2);
    ctx.beginPath(); ctx.moveTo(7, -2); ctx.lineTo(12, 0); ctx.lineTo(7, 2); fs('#ffa63d', null);
    circ(3.5, -2, 1.3, '#2a211c');
    ctx.restore();
  }
}

/* ================= game flow ================= */
function go(st) {
  S.state = st; S.stateT = 0;
  if (st === 'STOP') {
    audio.brake();
    const e = S.geom[0];
    if (e) for (let i = 0; i < 5; i++) smoke(e.chim.x, e.chim.y, true);
  } else if (st === 'GUIDE') {
    S.stroke = []; S.primary = null; S.idle = 0; S.strokeDone = false; S.drawDist = 0; S.tapQueue = 0;
  } else if (st === 'REWARD') {
    startReward();
  }
}
// 駅: ①動物が1匹降りる → ②タップ(どこでも)ごとに待っている動物が1匹ずつ乗る → ③全員乗ったら出発
function updateStation(st, dt) {
  const al = st.alighter;
  if (al.t < 0) {
    const seated = S.riders.filter(r => !r.pending);
    let g = S.geom[2], ox = 0;
    if (seated.length) { const r = seated[0], k = S.riders.indexOf(r); al.kind = r.kind; g = S.geom[1 + (k >> 1)]; ox = k % 2 ? 12 : -12; S.riders.splice(k, 1); }
    al.sx = g.cx + ox; al.sy = g.cy - 30; al.x = al.sx; al.y = al.sy; al.t = 0; S.tapQueue = 0; audio.pop();
  }
  if (al.t < 1) {
    al.t = Math.min(1, al.t + dt / 0.6);
    const tx = st.pL + 26, ty = GY + 8, u = al.t;
    al.x = al.sx + (tx - al.sx) * u; al.y = al.sy + (ty - al.sy) * u - Math.sin(u * Math.PI) * 30;
    if (al.t >= 1) sparks(al.x, al.y - 20, 6);
    return;
  }
  const hopping = st.waiting.some(p => p.state === 'hop');
  const next = st.waiting.find(p => p.state === 'wait');
  if (next && !hopping) {
    st.nextT -= dt;
    const auto = S.idle > config.autoAt * 0.6 && st.nextT <= 0;
    if (S.tapQueue > 0 || auto) {
      S.tapQueue = Math.max(0, S.tapQueue - 1);
      if (S.riders.length >= 4) S.riders.shift();
      next.slot = S.riders.length; S.riders.push({ kind: next.kind, pending: true }); next.seat = S.riders[next.slot];
      next.state = 'hop'; next.t = 0; next.sx = next.x; next.sy = next.y; st.nextT = 0.7; audio.hop();
    }
  }
  for (const p of st.waiting) if (p.state === 'hop') {
    p.t = Math.min(1, p.t + dt / 0.55);
    const k = Math.max(0, S.riders.indexOf(p.seat)), g = S.geom[1 + (k >> 1)], tx = g.cx + (k % 2 ? 12 : -12), ty = g.cy - 26, u = p.t;
    p.x = p.sx + (tx - p.sx) * u; p.y = p.sy + (ty - p.sy) * u - Math.sin(u * Math.PI) * 46;
    if (p.t >= 1) { p.state = 'in'; p.seat.pending = false; S.jiggle = 0.3; sparks(tx, ty - 10, 8); audio.pon(); }
  }
  if (!next && !hopping) { S.wave = true; audio.doorChime(); go('DEPART'); }
}
// 触れている指(手のひら以外)があれば、それをなぞりの指にして DRAW へ
// 止まっているときのカメラ位置(停車位置〜右岸、駅はホーム全体が中央に来る)
function sceneCenter(c) { return c.kind === 'station' ? (c.pL + c.pR) / 2 - S.W / 2 : (c.L - config.stopGap + c.R) / 2 - S.W / 2; }
// 走行中のカメラ: ふだんは電車を左寄り(0.32)で追い、止まる位置が近づくと少し先回りして、
// 電車が止まる前に止まる位置のカメラ(sceneCenter)に着いて静止する
// 汽車の最後尾が画面に入っている限界のカメラ位置(これより右へは行かない=汽車を置いていかない)
function trainKeep() { return S.trainX - TRAIN_LEN - 16; }
function runTarget(c) {
  // 止まる位置が近づくと、カメラは次の川(踏切・駅)のほうへ少しずつ先回りする。
  // ただし汽車の最後尾が画面から出ない範囲まで(汽車を置いていかない)
  const dist = c.L - config.stopGap - S.trainX, k = clamp((1100 - dist) / 600, 0, 1);
  const ramp = S.state === 'RUN' ? clamp(S.stateT / 1.6, 0, 1) : 1;
  const e = k * k * (3 - 2 * k) * ramp * ramp * (3 - 2 * ramp);
  const want = (S.trainX - 0.32 * S.W) * (1 - e) + sceneCenter(c) * e;
  return Math.min(want, trainKeep());
}
function adoptPointer() {
  for (const [id, p] of S.active) {
    if (p.palm) continue;
    S.primary = id; S.stroke = [{ x: p.wx, y: p.wy }]; S.lastMove = S.time;
    S.strokeDone = false; S.drawDist = 0; S.idle = 0;
    go('DRAW'); audio.pon();
    return true;
  }
  return false;
}
// 早めになぞり始めたときも、電車は止まる位置までなめらかに進んで止まる
function approachStop(dt) {
  const stopAt = S.cur.L - config.stopGap, dist = stopAt - S.trainX;
  if (dist > 0.6) moveTrain(dt, Math.min(config.vmax, 8 + dist * 1.6));
  if (S.vel > 0 && stopAt - S.trainX <= 0.6) {
    S.trainX = stopAt; S.vel = 0; audio.brake();
    const e = S.geom[0]; if (e) for (let i = 0; i < 4; i++) smoke(e.chim.x, e.chim.y, true);
  }
}
function startBuild(pts) {
  const r = S.cur;
  r.bridge = makeBridge(r.L, r.R, pts);
  r.bt = 0; r.plankN = 0; r.burst = false;
  S.primary = null;
  go('BUILD');
}
// 踏切では、車が渡り終えるのを見せるため少し長め
function rewardDur(c) { return c.kind === 'crossing' ? config.rewardTime + 1.4 : config.rewardTime; }
function startReward() {
  audio.whistle(); setTimeout(() => audio.chime(), 500);
  const e = S.geom[0];
  if (e) stars(e.cx, e.cy - 50, 16);
  S.wave = true; S.rw = {}; S.hopIdx = -1;
  const pick = Object.keys(defs.rewards).sort(() => Math.random() - 0.5).slice(0, 2);
  pick.forEach(k => defs.rewards[k](S));
}
function moveTrain(dt, target) {
  S.vel += clamp(target - S.vel, -config.brake * dt, config.accel * dt);
  if (S.vel < 0) S.vel = 0;
  S.trainX += S.vel * dt;
  S.tickX += S.vel * dt;
  if (S.tickX > 60) {
    S.tickX = 0;
    const wx = S.trainX - 30;
    audio.gatan(S.rivers.some(r => r.bridge && wx > r.L && wx < r.R));
  }
}
function trainGeom() {
  const out = []; let x = S.trainX;
  for (const c of VEH.cars) {
    const cx = x - c.len / 2; x -= c.len + VEH.gap;
    const yL = trackY(cx - c.hb), yR = trackY(cx + c.hb);
    const ang = Math.atan2(yR - yL, 2 * c.hb), cy = (yL + yR) / 2 - S.hopY;
    const g = { cx, cy, ang, def: c };
    if (c.engine) {
      const lx = 18, ly = -60;
      g.chim = { x: cx + lx * Math.cos(ang) - ly * Math.sin(ang), y: cy + lx * Math.sin(ang) + ly * Math.cos(ang) };
    }
    out.push(g);
  }
  return out;
}

function update(dt) {
  S.time += dt; S.stateT += dt;
  const cur = S.cur;
  switch (S.state) {
    case 'RUN': {
      // 川の手前で少し離れて止まる(なぞり始める左岸を電車がふさがないように)
      const stopAt = cur.L - config.stopGap, dist = stopAt - S.trainX;
      moveTrain(dt, Math.min(config.vmax, 8 + dist * 1.6));
      if (dist <= 0.6) { S.trainX = stopAt; S.vel = 0; S.geom = trainGeom(); go('STOP'); break; }
      // 止まる前でも、減速が始まったら(川や踏切が見えてきたら)なぞり/タップを受け付ける。電車はそのまま止まる位置まで進む
      // 川(踏切)の全体が画面に入ったら受け付ける(カメラが移動中でも。なぞり中はカメラを止める)
      const armed = cur.L - 30 - S.camX > 0 && (cur.L + cur.R) / 2 + 40 - S.camX < S.W;
      if (armed && cur.kind === 'river' && adoptPointer()) break;
      if (armed && cur.kind === 'crossing' && [...S.active.values()].some(p => !p.palm)) { S.bellT = 0; go('GATE'); }
      break;
    }
    case 'STOP':
      if (S.stateT > 0.35) go('GUIDE');
      break;
    case 'GUIDE':
      S.idle += dt;
      // 放置されたら、電車が「ぽっ」と呼びかける
      if (S.idle > config.guideEmphAt) { S.callT -= dt; if (S.callT <= 0) { S.callT = 5; audio.toot(); S.jiggle = 0.4; } }
      else S.callT = 0;
      if (cur.kind === 'station') { updateStation(cur, dt); break; }
      // 踏切: どこに触れても(タップでもなぞりでも)遮断機が下りる
      if (cur.kind === 'crossing') {
        if ([...S.active.values()].some(p => !p.palm) || S.idle > config.autoAt) { S.bellT = 0; go('GATE'); }
        break;
      }
      if (adoptPointer()) break;
      if (S.idle > config.autoAt) startBuild([]);
      break;
    case 'DRAW':
      approachStop(dt);
      if (S.time - S.lastMove > config.drawStallAt) startBuild(S.stroke);
      break;
    case 'DEPART':
      // ピンポン → 汽笛 → 乗客が手を振りながら出発、止まらずに次の場面へ
      if (S.stateT > 0.7 && !cur.tooted) { cur.tooted = true; audio.whistle(); S.jiggle = 0.4; }
      if (S.stateT > 1.0) moveTrain(dt, Math.min(config.vmax * 0.75, (S.stateT - 1.0) * 70));
      if (S.stateT >= config.departTime) { S.wave = false; nextScene(); }
      break;
    case 'GATE':
      approachStop(dt);
      cur.gate = clamp(S.stateT / 1.1, 0, 1);
      if (S.stateT > 1.4) go('PASS');
      break;
    case 'PASS':
      moveTrain(dt, Math.min(config.vmax * 0.75, config.crossV + S.stateT * 30));
      if (S.trainX - TRAIN_LEN > cur.R + 10) go('REWARD');
      break;
    case 'BUILD': {
      approachStop(dt);
      cur.bt += dt;
      const b = cur.bridge, bt = cur.bt;
      const cnt = bt >= 0.15 ? Math.min(b.N, Math.floor((bt - 0.15) / 1.3 * b.N) + 1) : 0;
      const step = Math.ceil(b.N / 9);
      while (cur.plankN < cnt) {
        const i = cur.plankN++;
        const x = cur.L + (i * b.pe + b.pe / 2) * b.dx;
        sparks(x, bridgeY(b, Math.min(x, cur.R)) - 6, 4);
        if (i % step === 0) { audio.plank(Math.floor(i / step), cur.type); buzz(8); }
      }
      if (bt > 1.75 && !cur.burst) {
        cur.burst = true; cur.rb = 0; S.shake = 0.3; audio.chime(); buzz(30);
        for (let i = 0; i < 9; i++) { const x = cur.L + (i + 0.5) / 9 * (cur.R - cur.L); stars(x, bridgeY(b, x) - 10, 2); }
      }
      if (bt >= config.buildTime) go('CROSS');
      break;
    }
    case 'CROSS':
      moveTrain(dt, config.crossV);
      if (S.trainX >= cur.R + 36) go('REWARD');
      break;
    case 'REWARD': {
      // 渡ったら止まらず、ごほうびを見せながら少しずつ加速して次へ
      moveTrain(dt, Math.min(config.vmax * 0.75, config.crossV + S.stateT * 18));
      const t = S.stateT - 0.5;
      if (S.rw.hop && t > 0 && t < 1.2) {
        S.hopY = Math.abs(Math.sin(Math.PI * t / 0.6)) * 16;
        const idx = Math.floor(t / 0.6);
        if (idx !== S.hopIdx) { S.hopIdx = idx; audio.hop(); }
      } else S.hopY = 0;
      if (S.rw.confetti && S.stateT < 3) for (let i = 0; i < 2; i++) confetti();
      for (const a of S.animals) if (!a.popped && S.time >= a.t0) { a.popped = true; audio.pop(); sparks(a.x, a.y - 40, 6); }
      // 踏切: 遮断機が上がり、待っていた車が「ププッ」と鳴らして渡る
      if (cur.kind === 'crossing') {
        cur.gate = clamp(1 - (S.stateT - 0.3) / 0.8, 0, 1);
        if (S.stateT > 0.9 && !cur.honked) { cur.honked = true; audio.honk(); }
        cur.carT = clamp((S.stateT - 1.0) / 1.6, 0, 1);
      }
      if (S.stateT >= rewardDur(cur)) { S.hopY = 0; S.wave = false; nextScene(); }
      break;
    }
  }
  lerpTheme(dt);
  updateScenery(dt);
  // 踏切の警報音(遮断機が下りている間、カンカン)
  if (cur.kind === 'crossing' && (S.state === 'GATE' || S.state === 'PASS' || (S.state === 'REWARD' && cur.gate > 0.6))) {
    S.bellT -= dt; if (S.bellT <= 0) { S.bellT = 0.34; audio.bell(); }
  }
  S.shake = Math.max(0, S.shake - dt);
  S.jiggle = Math.max(0, S.jiggle - dt);
  S.sunSpin = Math.max(0, S.sunSpin - dt);
  for (const r of S.rivers) if (r.burst) r.rb += dt;
  if (S.state === 'REWARD' || (S.state === 'DEPART' && S.stateT > 0.6)) {
    S.heartT -= dt;
    if (S.heartT <= 0 && S.stateT < 3.2) {
      S.heartT = 0.22;
      const g = S.geom[1 + ((Math.random() * 2) | 0)];
      if (g) addP({ type: 'heart', x: g.cx + rand(-14, 14), y: g.cy - 40, vx: rand(-10, 10), vy: -rand(35, 55), g: 0, life: 1.4, max: 1.4, size: rand(6, 9), color: '#ff6b8e' });
    }
  }
  S.fishT -= dt;
  if (S.fishT <= 0) {
    S.fishT = rand(3, 6);
    const rv = S.rivers.find(r => r.R > S.camX + 20 && r.L < S.camX + S.W - 20);
    if (rv) fish(rand(rv.L + 14, rv.R - 14));
  }
  S.geom = trainGeom();
  const e = S.geom[0];
  S.smokeT -= dt;
  if (S.smokeT <= 0 && e && S.state !== 'STOP') { smoke(e.chim.x, e.chim.y); S.smokeT = S.vel > 5 ? 0.1 : 0.35; }

  let target;
  // 場面が切りかわったフレームでも新しい場面を見る(更新の最初に読んだ cur は古い場面のことがある)
  const cc = S.cur;
  // 止まっている間は「電車の先頭〜右岸」を画面の中央に
  const center = sceneCenter(cc);
  if (S.state === 'DRAW') {
    const need = cc.R + config.finishOver + 70 - S.W;
    target = need > S.camX ? Math.max(S.camX, Math.min(need, cc.kind === 'station' ? need : trainKeep())) : S.camX;
  }
  // 走行中は電車を追い、川(踏切・駅)の位置まで来たらそこで止まって、電車が画面に入ってきて止まる
  else if (S.state === 'RUN') target = runTarget(cc);
  else if (S.state === 'READY') target = S.trainX - 0.32 * S.W;
  else if (S.state === 'REWARD' && cc.kind === 'crossing') {
    // 車が踏切を渡り終えるまでは踏切を画面に残し、そのあと電車にゆっくり追いつく
    const hold = Math.min(Math.max(center, S.trainX - 0.85 * S.W), cc.x - 120), rt = rewardDur(cc);
    const u = clamp((S.stateT - 2.6) / (rt - 2.6), 0, 1), e = u * u * (3 - 2 * u);
    target = hold + (S.trainX - 0.32 * S.W - hold) * e;
  }
  else if (S.state === 'REWARD') {

  ctx.save(); ctx.translate(x, y); ctx.rotate(0.42); ctx.scale(sc, sc);
  if (!spr('hand', 0, 0)) {
    circ(0, 38, 17, '#ffd6b3', '#c98f62', 2.5);
    rr(-7.5, 0, 15, 40, 7.5); fs('#ffd6b3', '#c98f62', 2.5);
  }
  ctx.restore();
}
function drawGuide() {
  const r = S.cur, gap = r.R - r.L, emph = S.idle > config.guideEmphAt, guiding = S.state === 'GUIDE';
  if (S.state !== 'GUIDE' && S.state !== 'DRAW') return;
  if (r.kind === 'station') {
    // 指が次に乗る動物をトントンする
    const next = r.waiting.find(p => p.state === 'wait');
    if (r.alighter.t < 1 || !next || r.waiting.some(p => p.state === 'hop')) return;
    const emphS = S.idle > config.guideEmphAt, tap = Math.abs(Math.sin(S.time * (emphS ? 5 : 3.2)));
    circ(next.x, next.y - 30, 12 + (1 - tap) * 18, 'rgba(255,255,255,' + (0.5 * tap).toFixed(2) + ')');
    drawFinger(next.x + 6, next.y - 22 - tap * 12, emphS ? 1.15 : 0.95);
    return;
  }
  if (r.kind === 'crossing') {
    // 指が警報ランプをトントンする
    const emphC = S.idle > config.guideEmphAt, tap = Math.abs(Math.sin(S.time * (emphC ? 5 : 3.2)));
    const lx = r.L - 12, ly = GY + 44 - 44;
    circ(lx, ly, 14 + (1 - tap) * (emphC ? 30 : 22), 'rgba(255,255,255,' + (0.55 * tap).toFixed(2) + ')');
    drawFinger(lx + 4, ly + 4 - tap * 14, emphC ? 1.25 : 1.05);
    return;
  }
  const a = guiding ? 1 : 0.3, pulse = 0.5 + 0.5 * Math.sin(S.time * (emph ? 9 : 5));
  const archAt = t => GY - 8 - 30 * 4 * t * (1 - t);
  const nDots = Math.max(8, Math.round(gap / 16));
  // ゴール(向こう岸の上)に光る星。ここまでなぞればいいことを絵で示す
  {
    const gx = r.R + config.finishOver, gy = GY - 12, p = 0.5 + 0.5 * Math.sin(S.time * 4);
    ctx.save(); ctx.globalAlpha = guiding ? 1 : 0.6;
    circ(gx, gy, 14 + p * 6, 'rgba(255,240,150,.45)');
    ctx.translate(gx, gy); ctx.rotate(Math.sin(S.time * 2) * 0.2); starPath(9 + p * 2); fs('#ffe066', '#e0a020', 1.6);
    ctx.restore();
  }
  for (let i = 0; i <= nDots; i++) {
    const t = i / nDots, x = r.L + gap * t, y = archAt(t);
    ctx.globalAlpha = a * (0.4 + 0.5 * pulse);
    circ(x, y, emph ? 13 : 10, 'rgba(255,246,150,.5)');
    ctx.globalAlpha = a;
    circ(x, y, emph ? 6.5 : 5, '#fff6a8', '#f0b429', 2);
  }
  ctx.globalAlpha = 1;
  if (guiding) {
    const cyc = emph ? 1.6 : 2.4, u = (S.time % cyc) / cyc, t0 = clamp(u / 0.7, 0, 1), t = t0 * t0 * (3 - 2 * t0);
    ctx.globalAlpha = clamp(u / 0.06, 0, 1) * clamp((1 - u) / 0.12, 0, 1);
    // 指のお手本も、ゴールの星(向こう岸の上)までなぞる
    const span = gap + config.finishOver, x = r.L + span * t, y = x <= r.R ? archAt((x - r.L) / gap) : GY - 10;
    circ(x, y, 10 + 8 * pulse, 'rgba(255,255,255,.55)');
    drawFinger(x, y, emph ? 1.25 : 1);
    ctx.globalAlpha = 1;
  }
}

/* ================= render: main ================= */
function render() {
  ctx.setTransform(S.dpr * S.s, 0, 0, S.dpr * S.s, 0, S.dpr * S.s * S.oy);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  drawSky(); drawClouds(); drawBirds();
  drawHills(0.25, 215, 40, 0.012, th.h1);
  drawHills(0.5, 238, 28, 0.02, th.h2);
  // 橋の完成時は、ガタガタではなく「ぽよん」と1回弾むだけ
  ctx.save(); ctx.translate(-S.camX, S.shake > 0 ? Math.sin((0.3 - S.shake) * 21) * S.shake * 10 : 0);
  const xs = S.camX - 60, xe = S.camX + S.W + 60;
  for (const r of S.rivers) if (r.burst && r.R > xs && r.L < xe) drawRainbow(r);
  drawTrees(xs, xe);
  for (const r of S.rivers) if (r.R > xs && r.L < xe) drawWater(r);
  let prev = -1e5;
  const segs = [];
  for (const r of S.rivers) { segs.push([prev, r.L, prev > -1e4, true]); prev = r.R; }
  segs.push([prev, 1e6, true, false]);
  for (const [a, b, rl, rrr] of segs) {
    const aa = Math.max(a, xs), bb = Math.min(b, xe);
    if (aa < bb) drawSeg(aa, bb, rl && aa === a, rrr && bb === b);
  }
  drawFlowers(xs, xe);
  for (const c of S.crossings) if (c.R + 60 > xs && c.L - 60 < xe) drawCrossingBack(c);
  for (const st of S.stations) if (st.pR + 30 > xs && st.pL - 30 < xe) drawStationBack(st);
  for (const r of S.rivers) if (r.R > xs && r.L < xe) drawBridge(r);
  for (const g of S.geom) if (g.cy + S.hopY > GY - 3 && g.cy + S.hopY < GY + 3) {
    ctx.fillStyle = 'rgba(0,0,0,' + (0.2 - S.hopY * 0.006) + ')'; ctx.beginPath(); ctx.ellipse(g.cx, GY + 11, g.def.len / 2 - 2, 4, 0, 0, 6.2832); ctx.fill();
  }
  S.geom.slice().reverse().forEach(drawCar);
  for (const c of S.crossings) if (c.R + 60 > xs && c.L - 60 < xe) drawCrossingFront(c);
  for (const st of S.stations) if (st.pR + 30 > xs && st.pL - 30 < xe) drawStationFront(st);
  for (const a of S.animals) drawAnimal(a);
  drawBirdsFlying();
  drawParticles();
  drawStroke();
  drawGuide();
  drawReadyHint();
  ctx.restore();
  if (!S.lowFx) drawOverlay();
}
// 紙の粒子+周辺減光は、サイズが変わった時だけ作ってキャッシュし、毎フレームは1回の貼り付けだけにする
let overlay = null, overlayKey = '';
function drawOverlay() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const w = canvas.width, h = canvas.height, key = w + 'x' + h;
  if (key !== overlayKey) {
    overlayKey = key;
    overlay = document.createElement('canvas'); overlay.width = w; overlay.height = h;
    const oc = overlay.getContext('2d');
    // 画用紙の地: 白地に細かな濃淡と繊維。乗算で重ねる
    const T = 160, g = document.createElement('canvas'); g.width = g.height = T;
    const gc = g.getContext('2d'), id = gc.createImageData(T, T);
    for (let i = 0; i < id.data.length; i += 4) { const v = 238 + Math.random() * 17; id.data[i] = v; id.data[i + 1] = v - 2; id.data[i + 2] = v - 6; id.data[i + 3] = 255; }
    gc.putImageData(id, 0, 0);
    gc.strokeStyle = 'rgba(180,165,140,.18)'; gc.lineWidth = 0.8;
    for (let i = 0; i < 40; i++) { const x = Math.random() * T, y = Math.random() * T, a = Math.random() * 6.28, l = 4 + Math.random() * 10; gc.beginPath(); gc.moveTo(x, y); gc.quadraticCurveTo(x + Math.cos(a + 0.5) * l / 2, y + Math.sin(a + 0.5) * l / 2, x + Math.cos(a) * l, y + Math.sin(a) * l); gc.stroke(); }
    oc.fillStyle = oc.createPattern(g, 'repeat'); oc.fillRect(0, 0, w, h);
    oc.globalCompositeOperation = 'multiply';
    const vg = oc.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.45, w / 2, h / 2, Math.hypot(w, h) * 0.62);
    vg.addColorStop(0, 'rgb(255,255,255)'); vg.addColorStop(1, 'rgb(232,214,196)');
    oc.fillStyle = vg; oc.fillRect(0, 0, w, h);
  }
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(overlay, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
}

/* ================= boot ================= */
let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const raw = (t - last) / 1000 || 0;
  const dt = Math.min(0.05, raw); last = t;
  // 重い端末では自動で軽量モード(粒子オーバーレイ無し・解像度控えめ・粒子数減)に切り替える
  const paused = document.hidden || S.portrait || S.menuOpen;
  if (!paused && raw > 0 && raw < 0.25) S.ftAvg = S.ftAvg * 0.97 + raw * 0.03;
  if (!S.lowFx && S.time > 4 && S.ftAvg > 0.03) { S.lowFx = true; resize(); }
  // 回転直後に resize が来ない/寸法が古い端末があるため、毎フレーム寸法を見て追従する
  if (window.innerWidth !== S.cw || window.innerHeight !== S.ch) resize();
  if (!(document.hidden || S.portrait || S.menuOpen)) update(dt);
  render();
}
resize();
S.cur = makeRiver(S.trainX, 700);
S.rivers.push(S.cur);
S.upcoming = makeScene(1, S.cur.R);
S.camX = S.trainX - 0.32 * S.W;
S.geom = trainGeom();
// 絵の準備ができてから始める(読み込みに失敗した絵は簡易描画で代用。最長2秒で開始)
Promise.race([loadSprites(), new Promise(r => setTimeout(r, 2000))]).then(() => requestAnimationFrame(frame));
if (/[?&]debug\b/.test(location.search)) window.__nz = { S, makeBridge, sag, config, SPR, ctx, drawAnimal, drawRider, drawCar, drawSky, sunPos, scenery, cloudList, audio };
})();
